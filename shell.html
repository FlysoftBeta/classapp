<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Talos II</title>
    <style>
      html,
      body,
      #shell {
        height: 100%;
        margin: 0;
      }
      body {
        background: #fff;
        color: #737373;
        font:
          12px system-ui,
          sans-serif;
      }
      #shell {
        display: grid;
        place-items: center;
      }
      .status {
        text-align: center;
      }
      .error {
        max-width: 32rem;
        padding: 1rem;
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div id="shell"><div class="status">正在加载应用…</div></div>
    <script>
      (function () {
        if ("serviceWorker" in navigator && window.isSecureContext) {
          navigator.serviceWorker
            .register("/service-worker.js", { scope: "/" })
            .catch(function (error) {
              console.warn("Service Worker 注册失败，离线入口不可用", error);
            });
        }
        var DB = "classapp-runtime";
        var DB_VERSION = 5;
        var ACTIVE_BUILD_KEY = "active-bundle";
        function createSchema(db) {
          db.createObjectStore("files");
          var heads = db.createObjectStore("file_heads", { keyPath: "id" });
          heads.createIndex("by-state-created", ["state", "created_at"]);
          if (!db.objectStoreNames.contains("globals")) {
            db.createObjectStore("globals", { keyPath: "key" });
          }
          if (!db.objectStoreNames.contains("bundles")) {
            db.createObjectStore("bundles", { keyPath: "build_id" });
          }

          var groups = db.createObjectStore("domain_groups", { keyPath: "id" });
          groups.createIndex("by-conv", "conv_id", { unique: true });
          groups.createIndex("by-handle", "handle", { unique: true });
          var dms = db.createObjectStore("domain_dms", { keyPath: "conv_id" });
          dms.createIndex("by-peer-a", "peer_a");
          dms.createIndex("by-peer-b", "peer_b");
          var posts = db.createObjectStore("domain_posts", { keyPath: "id" });
          posts.createIndex(
            "by-conversation-sequence",
            ["conv_id", "sequence"],
            { unique: true },
          );
          posts.createIndex("by-conversation-revision", [
            "conv_id",
            "revision",
          ]);
          posts.createIndex("by-eviction", ["eviction_tier", "touched_at"]);
          var articles = db.createObjectStore("domain_articles", {
            keyPath: "id",
          });
          articles.createIndex("by-group-created", [
            "group_id",
            "created_at",
            "id",
          ]);
          articles.createIndex("by-eviction", ["eviction_tier", "touched_at"]);
          var segments = db.createObjectStore("domain_article_segments", {
            keyPath: ["article_id", "start_offset"],
          });
          segments.createIndex("by-article", "article_id");
          segments.createIndex(
            "by-article-start",
            ["article_id", "start_offset"],
            { unique: true },
          );
          segments.createIndex("by-eviction", ["eviction_tier", "touched_at"]);
          var users = db.createObjectStore("domain_users", { keyPath: "id" });
          users.createIndex("by-handle", "handle", { unique: true });

          db.createObjectStore("domain_me", { keyPath: "me_id" });
          var access = db.createObjectStore("domain_me_access", {
            keyPath: ["me_id", "kind", "object_id"],
          });
          access.createIndex("by-me-kind", ["me_id", "kind"]);
          access.createIndex("by-object", ["kind", "object_id"]);
          var convState = db.createObjectStore("domain_me_conv_state", {
            keyPath: ["me_id", "conv_id"],
          });
          convState.createIndex("by-me", "me_id");
          convState.createIndex("by-pending", ["me_id", "pending"]);
          var articleState = db.createObjectStore("domain_me_article_state", {
            keyPath: ["me_id", "article_id"],
          });
          articleState.createIndex("by-me", "me_id");
          articleState.createIndex("by-pending", ["me_id", "pending"]);
          var meState = db.createObjectStore("domain_me_state", {
            keyPath: ["me_id", "key"],
          });
          meState.createIndex("by-me", "me_id");
          meState.createIndex("by-pending", ["me_id", "pending"]);
          var save = db.createObjectStore("domain_save", {
            keyPath: ["claimant", "kind", "object_id"],
          });
          save.createIndex("by-resource", ["kind", "object_id"]);
          save.createIndex("by-expiry", ["kind", "protected_until"]);
          var sync = db.createObjectStore("domain_sync", { keyPath: "scope" });
          sync.createIndex("by-kind", "kind");
        }
        function open() {
          return new Promise(function (resolve, reject) {
            var request = indexedDB.open(DB, DB_VERSION);
            request.onupgradeneeded = function (event) {
              var db = request.result;
              if (event.oldVersion > 0) {
                var names = Array.prototype.slice.call(db.objectStoreNames);
                for (var index = 0; index < names.length; index += 1) {
                  if (
                    event.oldVersion < 4 ||
                    (names[index] !== "globals" && names[index] !== "bundles")
                  ) {
                    db.deleteObjectStore(names[index]);
                  }
                }
              }
              createSchema(db);
            };
            request.onsuccess = function () {
              request.result.onversionchange = function () {
                request.result.close();
              };
              resolve(request.result);
            };
            request.onerror = function () {
              reject(request.error);
            };
          });
        }
        function idb(request) {
          return new Promise(function (resolve, reject) {
            request.onsuccess = function () {
              resolve(request.result);
            };
            request.onerror = function () {
              reject(request.error);
            };
          });
        }
        function storeBundle(db, buildId, body) {
          return new Promise(function (resolve, reject) {
            var transaction = db.transaction(
              ["bundles", "globals"],
              "readwrite",
            );
            transaction.objectStore("bundles").put({
              build_id: buildId,
              entrypoint_code: body,
              installed_at: Date.now(),
            });
            transaction.objectStore("globals").put({
              key: ACTIVE_BUILD_KEY,
              value: buildId,
            });
            transaction.oncomplete = function () {
              resolve();
            };
            transaction.onerror = function () {
              reject(transaction.error);
            };
            transaction.onabort = function () {
              reject(transaction.error);
            };
          });
        }
        function loadBundle(body) {
          var url = URL.createObjectURL(
            new Blob([body], { type: "text/javascript" }),
          );
          return new Promise(function (resolve, reject) {
            var script = document.createElement("script");
            script.type = "module";
            script.src = url;
            script.onload = function () {
              resolve();
            };
            script.onerror = function () {
              reject(new Error("bundle module load failed"));
            };
            document.head.appendChild(script);
          }).then(
            function () {
              setTimeout(function () {
                URL.revokeObjectURL(url);
              }, 60000);
            },
            function (error) {
              URL.revokeObjectURL(url);
              throw error;
            },
          );
        }
        function boot() {
          var db;
          var record = null;
          return open()
            .then(function (opened) {
              db = opened;
              return idb(
                db
                  .transaction("globals")
                  .objectStore("globals")
                  .get(ACTIVE_BUILD_KEY),
              );
            })
            .then(function (activeRecord) {
              if (!activeRecord || !activeRecord.value) return null;
              return idb(
                db
                  .transaction("bundles")
                  .objectStore("bundles")
                  .get(activeRecord.value),
              );
            })
            .then(function (stored) {
              record = stored;
              if (record) return;
              return fetch("/app/manifest.json", {
                cache: "no-store",
              })
                .then(function (response) {
                  if (!response.ok)
                    throw new Error("manifest " + response.status);
                  return response.json();
                })
                .then(function (manifest) {
                  return fetch(manifest.bundle.url, {
                    cache: "no-store",
                  })
                    .then(function (response) {
                      if (!response.ok)
                        throw new Error("bundle " + response.status);
                      return response.arrayBuffer();
                    })
                    .then(function (body) {
                      record = {
                        build_id: manifest.buildId,
                        entrypoint_code: body,
                      };
                      return storeBundle(db, manifest.buildId, body);
                    });
                });
            })
            .then(function () {
              db.close();
              return loadBundle(record.entrypoint_code);
            })
            .catch(function (error) {
              if (db) db.close();
              throw error;
            });
        }
        boot().catch(function (error) {
          document.getElementById("shell").innerHTML =
            '<div class="error">应用无法加载。请检查网络后刷新。<br><small>' +
            String(error) +
            "</small></div>";
        });
      })();
    </script>
  </body>
</html>
