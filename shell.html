<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Talos II</title>
    <style>
      html,
      body,
      #shell {
        height: 100%;
        margin: 0;
      }
      body {
        background: #fff;
        color: #737373;
        font:
          12px system-ui,
          sans-serif;
      }
      #shell {
        display: grid;
        place-items: center;
      }
      .status {
        text-align: center;
      }
      .error {
        max-width: 32rem;
        padding: 1rem;
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div id="shell"><div class="status">正在加载应用…</div></div>
    <script>
      (function () {
        if ("serviceWorker" in navigator && window.isSecureContext) {
          navigator.serviceWorker
            .register("/service-worker.js", { scope: "/" })
            .catch(function (error) {
              console.warn("Service Worker 注册失败，离线入口不可用", error);
            });
        }
        var DB = "classapp-runtime";
        var DB_VERSION = 2;
        var ACTIVE_BUILD_KEY = "classapp-active-build";
        function legacyActiveBuild() {
          try {
            return localStorage.getItem(ACTIVE_BUILD_KEY);
          } catch (_) {
            return null;
          }
        }
        function clearLegacyActiveBuild() {
          try {
            localStorage.removeItem(ACTIVE_BUILD_KEY);
          } catch (_) {}
        }
        function open() {
          return new Promise(function (resolve, reject) {
            var request = indexedDB.open(DB, DB_VERSION);
            request.onupgradeneeded = function () {
              var db = request.result;
              if (!db.objectStoreNames.contains("bundles"))
                db.createObjectStore("bundles", { keyPath: "buildId" });
              if (!db.objectStoreNames.contains("resources")) {
                var store = db.createObjectStore("resources", {
                  keyPath: "key",
                });
                store.createIndex("by-class-and-touch", [
                  "resourceClass",
                  "touchedAt",
                ]);
              }
              if (!db.objectStoreNames.contains("kv")) {
                var kv = db.createObjectStore("kv", { keyPath: "key" });
                var legacy = legacyActiveBuild();
                if (legacy) {
                  kv.put({ key: ACTIVE_BUILD_KEY, value: legacy });
                }
              }
            };
            request.onsuccess = function () {
              request.result.onversionchange = function () {
                request.result.close();
              };
              resolve(request.result);
            };
            request.onerror = function () {
              reject(request.error);
            };
          });
        }
        function idb(request) {
          return new Promise(function (resolve, reject) {
            request.onsuccess = function () {
              resolve(request.result);
            };
            request.onerror = function () {
              reject(request.error);
            };
          });
        }
        function storeBundle(db, manifest, body) {
          return new Promise(function (resolve, reject) {
            var transaction = db.transaction(["bundles", "kv"], "readwrite");
            transaction.objectStore("bundles").put({
              buildId: manifest.buildId,
              body: body,
              installedAt: Date.now(),
              active: true,
            });
            transaction.objectStore("kv").put({
              key: ACTIVE_BUILD_KEY,
              value: manifest.buildId,
            });
            transaction.oncomplete = function () {
              clearLegacyActiveBuild();
              resolve();
            };
            transaction.onerror = function () {
              reject(transaction.error);
            };
            transaction.onabort = function () {
              reject(transaction.error);
            };
          });
        }
        function loadBundle(body) {
          var url = URL.createObjectURL(body);
          return new Promise(function (resolve, reject) {
            var script = document.createElement("script");
            script.type = "module";
            script.src = url;
            script.onload = function () {
              resolve();
            };
            script.onerror = function () {
              reject(new Error("bundle module load failed"));
            };
            document.head.appendChild(script);
          }).then(
            function () {
              setTimeout(function () {
                URL.revokeObjectURL(url);
              }, 60000);
            },
            function (error) {
              URL.revokeObjectURL(url);
              throw error;
            },
          );
        }
        function boot() {
          var db;
          var record = null;
          return open()
            .then(function (opened) {
              db = opened;
              return idb(
                db.transaction("kv").objectStore("kv").get(ACTIVE_BUILD_KEY),
              );
            })
            .then(function (activeRecord) {
              if (!activeRecord || !activeRecord.value) return null;
              clearLegacyActiveBuild();
              return idb(
                db
                  .transaction("bundles")
                  .objectStore("bundles")
                  .get(activeRecord.value),
              );
            })
            .then(function (stored) {
              record = stored;
              if (record) return;
              return fetch("/app/manifest.json", {
                cache: "no-store",
              })
                .then(function (response) {
                  if (!response.ok)
                    throw new Error("manifest " + response.status);
                  return response.json();
                })
                .then(function (manifest) {
                  return fetch(manifest.bundle.url, {
                    cache: "no-store",
                  })
                    .then(function (response) {
                      if (!response.ok)
                        throw new Error("bundle " + response.status);
                      return response.blob();
                    })
                    .then(function (body) {
                      record = {
                        buildId: manifest.buildId,
                        body: body,
                      };
                      return storeBundle(db, manifest, body);
                    });
                });
            })
            .then(function () {
              return loadBundle(record.body);
            });
        }
        boot().catch(function (error) {
          document.getElementById("shell").innerHTML =
            '<div class="error">应用无法加载。请检查网络后刷新。<br><small>' +
            String(error) +
            "</small></div>";
        });
      })();
    </script>
  </body>
</html>
