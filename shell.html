<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Talos II</title>
    <style>
      html,
      body,
      #shell {
        height: 100%;
        margin: 0;
      }
      body {
        background: #fff;
        color: #737373;
        font:
          12px system-ui,
          sans-serif;
      }
      #shell {
        display: grid;
        place-items: center;
      }
      .status {
        text-align: center;
      }
      .error {
        max-width: 32rem;
        padding: 1rem;
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div id="shell"><div class="status">正在加载应用…</div></div>
    <script>
      (function () {
        if ("serviceWorker" in navigator && window.isSecureContext) {
          navigator.serviceWorker
            .register("/service-worker.js", { scope: "/" })
            .catch(function (error) {
              console.warn("Service Worker 注册失败，离线入口不可用", error);
            });
        }
        var DB = "classapp-runtime";
        var BUNDLES = "shell_bundles";
        var KV = "shell_kv";
        var ACTIVE_BUILD_KEY = "active-bundle";
        function installShellSchema(request) {
          var db = request.result;
          var transaction = request.transaction;
          var bundles = db.objectStoreNames.contains(BUNDLES)
            ? transaction.objectStore(BUNDLES)
            : db.createObjectStore(BUNDLES, { keyPath: "build_id" });
          var kv = db.objectStoreNames.contains(KV)
            ? transaction.objectStore(KV)
            : db.createObjectStore(KV, { keyPath: "key" });
          kv.put({ key: "schema-version", value: 1 });

          // Preserve the bootable Bundle before app migration nukes every
          // yanked application store from the historical schema.
          if (db.objectStoreNames.contains("bundles")) {
            var legacyBundles = transaction.objectStore("bundles").getAll();
            legacyBundles.onsuccess = function () {
              for (
                var index = 0;
                index < legacyBundles.result.length;
                index += 1
              ) {
                bundles.put(legacyBundles.result[index]);
              }
            };
          }
          if (db.objectStoreNames.contains("globals")) {
            var legacyActive = transaction
              .objectStore("globals")
              .get(ACTIVE_BUILD_KEY);
            legacyActive.onsuccess = function () {
              if (legacyActive.result && legacyActive.result.value) {
                kv.put({
                  key: ACTIVE_BUILD_KEY,
                  value: legacyActive.result.value,
                });
              }
            };
          }
        }
        function openAt(version) {
          return new Promise(function (resolve, reject) {
            var settled = false;
            var blockedTimer = null;
            var request = version
              ? indexedDB.open(DB, version)
              : indexedDB.open(DB);
            request.onupgradeneeded = function () {
              installShellSchema(request);
            };
            request.onsuccess = function () {
              if (settled) {
                request.result.close();
                return;
              }
              settled = true;
              if (blockedTimer !== null) clearTimeout(blockedTimer);
              request.result.onversionchange = function () {
                request.result.close();
              };
              resolve(request.result);
            };
            request.onerror = function () {
              if (settled) return;
              settled = true;
              if (blockedTimer !== null) clearTimeout(blockedTimer);
              reject(request.error);
            };
            request.onblocked = function () {
              if (blockedTimer !== null) return;
              blockedTimer = setTimeout(function () {
                if (settled) return;
                settled = true;
                reject(new Error("IndexedDB Shell upgrade is blocked"));
              }, 5000);
            };
          });
        }
        function open() {
          return openAt().then(function (db) {
            var hasSchema =
              db.objectStoreNames.contains(BUNDLES) &&
              db.objectStoreNames.contains(KV);
            if (hasSchema) {
              return idb(
                db.transaction(KV).objectStore(KV).get("schema-version"),
              ).then(function (schema) {
                if (schema && schema.value === 1) return db;
                return upgradeShell(db);
              });
            }
            return upgradeShell(db);
          });
        }
        function upgradeShell(db) {
          var nextVersion = db.version + 1;
          db.close();
          return openAt(nextVersion)
            .then(function (upgraded) {
              // The app owner may have won this physical-version race. Reopen
              // and verify the shell marker before using either schema.
              upgraded.close();
              return open();
            })
            .catch(function (error) {
              if (error && error.name === "VersionError") return open();
              throw error;
            });
        }
        function idb(request) {
          return new Promise(function (resolve, reject) {
            request.onsuccess = function () {
              resolve(request.result);
            };
            request.onerror = function () {
              reject(request.error);
            };
          });
        }
        function storeBundle(db, buildId, body) {
          return new Promise(function (resolve, reject) {
            var transaction = db.transaction([BUNDLES, KV], "readwrite");
            transaction.objectStore(BUNDLES).put({
              build_id: buildId,
              entrypoint_code: body,
              installed_at: Date.now(),
            });
            transaction.objectStore(KV).put({
              key: ACTIVE_BUILD_KEY,
              value: buildId,
            });
            transaction.oncomplete = function () {
              resolve();
            };
            transaction.onerror = function () {
              reject(transaction.error);
            };
            transaction.onabort = function () {
              reject(transaction.error);
            };
          });
        }
        function loadBundle(body) {
          var url = URL.createObjectURL(
            new Blob([body], { type: "text/javascript" }),
          );
          return new Promise(function (resolve, reject) {
            var script = document.createElement("script");
            script.type = "module";
            script.src = url;
            script.onload = function () {
              resolve();
            };
            script.onerror = function () {
              reject(new Error("bundle module load failed"));
            };
            document.head.appendChild(script);
          }).then(
            function () {
              setTimeout(function () {
                URL.revokeObjectURL(url);
              }, 60000);
            },
            function (error) {
              URL.revokeObjectURL(url);
              throw error;
            },
          );
        }
        function boot() {
          var db;
          var record = null;
          return open()
            .then(function (opened) {
              db = opened;
              return idb(
                db.transaction(KV).objectStore(KV).get(ACTIVE_BUILD_KEY),
              );
            })
            .then(function (activeRecord) {
              if (!activeRecord || !activeRecord.value) return null;
              return idb(
                db
                  .transaction(BUNDLES)
                  .objectStore(BUNDLES)
                  .get(activeRecord.value),
              );
            })
            .then(function (stored) {
              record = stored;
              return fetch("/app/manifest.json", {
                cache: "no-store",
              })
                .then(function (response) {
                  if (!response.ok)
                    throw new Error("manifest " + response.status);
                  return response.json();
                })
                .then(function (manifest) {
                  if (record && record.build_id === manifest.buildId) return;
                  return fetch(manifest.bundle.url, {
                    cache: "no-store",
                  })
                    .then(function (response) {
                      if (!response.ok)
                        throw new Error("bundle " + response.status);
                      return response.arrayBuffer();
                    })
                    .then(function (body) {
                      record = {
                        build_id: manifest.buildId,
                        entrypoint_code: body,
                      };
                      return storeBundle(db, manifest.buildId, body);
                    });
                })
                .catch(function (error) {
                  // An already-active bundle is the offline bootstrap. Network
                  // refresh failure must not make a bootable installation fail.
                  if (record) {
                    console.warn(
                      "Bundle refresh failed; using active bundle",
                      error,
                    );
                    return;
                  }
                  throw error;
                });
            })
            .then(function () {
              db.close();
              return loadBundle(record.entrypoint_code);
            })
            .catch(function (error) {
              if (db) db.close();
              throw error;
            });
        }
        boot().catch(function (error) {
          document.getElementById("shell").innerHTML =
            '<div class="error">应用无法加载。请检查网络后刷新。<br><small>' +
            String(error) +
            "</small></div>";
        });
      })();
    </script>
  </body>
</html>
