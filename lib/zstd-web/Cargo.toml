[package]
name = "zstd-web"
version = "0.1.0"
edition = "2021"
description = "Small ruzstd decompression wrapper for browsers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ruzstd = "0.9.0"
wasm-bindgen = "0.2"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
